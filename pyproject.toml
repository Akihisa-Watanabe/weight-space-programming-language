[project]
name = "agentic-optimization"
version = "0.1.0"
description = "WeightIR: typed, contract-based weight-edit programs that an LLM writes and a compiler lowers to verified patches"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5",
    "scipy>=1.18",
    "torch>=2.14",
    "transformers>=5.20",
    "anthropic>=2.1",
    "pyarrow>=26.0.0",
    "torchvision>=0.29.1",
    "gymnasium>=1.4.0",
    "huggingface-hub>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weightir", "src/agentic", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
